<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/calendar/' | relative_url }}"{% if page.url == '/calendar.html' or page.url == '/calendar/' %} aria-current="page"{% endif %}>日历</a>
        <a href="{{ '/sources' | relative_url }}"{% if page.url == '/sources.html' or page.url == '/sources/' %} aria-current="page"{% endif %}>来源</a>
        <a href="{{ '/GEO-SEO News/' | relative_url }}"{% if page.url contains '/GEO-SEO%20News/' or page.url contains '/GEO-SEO News/' %} aria-current="page"{% endif %}>原始数据</a>
      </div>
    </nav>
  </header>
  
  <main>
    {{ content }}
  </main>
  
  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}.</p>
    {% assign source_names = site.data.sources.sources | map: "name" %}
    <p>数据来源：{{ source_names | join: ", " }}</p>
  </footer>
</body>
</html>
